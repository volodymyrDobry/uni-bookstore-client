name: CI

# Runs on every push to main and on every Pull Request targeting main,
# so the pipeline status is shown directly in the PR interface.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege by default; the publish job requests more where needed.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ---------------------------------------------------------------------------
  # 1. Build & Test — frontend service (React / Vite / TypeScript)
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (with npm dependency cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # a) Build — type-check (tsc -b) + bundle the production assets (vite build)
      - name: Build
        run: npm run build

      # b) Test — unit tests + coverage (Vitest)
      - name: Test
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 2. Static analysis — ESLint (BLOCKING). Runs in parallel with build/test.
  # ---------------------------------------------------------------------------
  static-analysis:
    name: Static analysis (ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js (with npm dependency cache)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Blocking: any lint violation fails the job (eslint exits non-zero).
      - name: ESLint
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 3. Build container image (local only, no publish) + vulnerability scan.
  #    Depends on successful build/test AND static analysis.
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build image & scan
    runs-on: ubuntu-latest
    needs: [ build-and-test, static-analysis ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the image locally into the runner (load: true, push: false),
      # using the Dockerfile from Lab 1.
      - name: Build frontend image (local, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: uni-book-store-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Recommended: blocking vulnerability scan before any publish.
      # Run Trivy from its official image against the image already loaded
      # into the runner's Docker daemon (avoids the flaky setup-trivy step).
      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${HOME}/.cache/trivy:/root/.cache/trivy" \
            aquasec/trivy:0.65.0 image \
              --exit-code 1 \
              --ignore-unfixed \
              --pkg-types os,library \
              --severity CRITICAL \
              uni-book-store-client:${{ github.sha }}

  # ---------------------------------------------------------------------------
  # 4. Publish image to GitHub Container Registry (ghcr.io).
  #    Only on push (never on Pull Requests). Two tags: commit SHA + latest.
  # ---------------------------------------------------------------------------
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [ docker-build ]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Auth via the built-in GITHUB_TOKEN — no credentials stored in the repo.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Tags: unique build tag (sha-<short>) + latest (default branch only).
      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
