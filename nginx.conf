server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # -------------------------------------------------------------------------
    # API gateway: keep every call same-origin (no browser CORS) and fan out to
    # the right microservice by path. Longest-prefix (^~) wins.
    #   book-management-service (8081): /api/v1/books*   (catalogue only)
    #   order-service           (8083): everything else  (basket, orders, admin)
    #
    # Upstreams are referenced through variables so Nginx resolves them per
    # request via Docker's embedded DNS (127.0.0.11) instead of at startup.
    # Without this, Nginx refuses to boot ("host not found in upstream") whenever
    # a backend is down — one stopped service would crash-loop the whole gateway.
    # -------------------------------------------------------------------------
    resolver 127.0.0.11 valid=10s ipv6=off;

    # book-management-service — catalogue (/api/v1/books, /api/v1/books/{id}/stock, ...)
    location ^~ /api/v1/books {
        set $book_service "book-management-service:8081";
        proxy_pass http://$book_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # order-service — admin live stream (SSE) & receipts ZIP export
    location ^~ /api/v1/admin/orders {
        set $order_service "order-service:8083";
        proxy_pass http://$order_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (/stream): nginx buffers responses by default,
        # which would hold back events indefinitely. Disable buffering, keep
        # the upstream connection open and let the long-lived stream (and the
        # potentially slow ZIP export) run without an idle read timeout.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    # order-service — basket, user orders & receipts (everything else under /api/)
    location ^~ /api/ {
        set $order_service "order-service:8083";
        proxy_pass http://$order_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Receipt PDFs can be large — stream them straight through.
        proxy_buffering off;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router — fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable caching for index.html so new deploys are picked up immediately
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
